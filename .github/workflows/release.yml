name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          # Put our keychain first in the search list so codesign finds it.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

      - name: Build & sign .app bundle
        run: ./build_app.sh

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Notary service wants an archive; zip the .app to submit it.
          ditto -c -k --keepParent "dist/Moomer.app" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          # Staple the ticket so the app validates offline.
          xcrun stapler staple "dist/Moomer.app"
          xcrun stapler validate "dist/Moomer.app"

      - name: Notarize standalone binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # build_app.sh already produced and Developer ID-signed ./moomer.
          # Notarize it too so the CLI binary isn't a Gatekeeper trap.
          # A bare Mach-O can't be stapled, but notarization is recorded
          # against its signature and verified online on first launch.
          ditto -c -k "moomer" "$RUNNER_TEMP/moomer-bin.zip"
          xcrun notarytool submit "$RUNNER_TEMP/moomer-bin.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Package DMG
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "dist/Moomer.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          DMG="Moomer-${VERSION}-macos.dmg"
          hdiutil create -volname "Moomer" \
            -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"

          # The DMG itself is signed so download-and-mount is clean; the
          # stapled app inside carries the notarization ticket.
          codesign --force --sign "$SIGN_ID" "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

          # Standalone signed + notarized capture binary, for CLI use
          # without the menu-bar launcher.
          tar -czf "moomer-${VERSION}-macos.tar.gz" moomer README.md
          shasum -a 256 "moomer-${VERSION}-macos.tar.gz" > "moomer-${VERSION}-macos.tar.gz.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Moomer-${{ github.ref_name }}-macos.dmg
            Moomer-${{ github.ref_name }}-macos.dmg.sha256
            moomer
            moomer-${{ github.ref_name }}-macos.tar.gz
            moomer-${{ github.ref_name }}-macos.tar.gz.sha256

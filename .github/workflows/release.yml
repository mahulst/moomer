name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Build .app bundle
        run: ./build_app.sh

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # The .app bundle (menu-bar launcher + capture tool + icon).
          ditto -c -k --keepParent "dist/Moomer.app" "Moomer-${VERSION}-macos.zip"
          shasum -a 256 "Moomer-${VERSION}-macos.zip" > "Moomer-${VERSION}-macos.zip.sha256"
          # The standalone capture binary, for CLI use without the launcher.
          # build_app.sh already produced ./moomer.
          tar -czf "moomer-${VERSION}-macos.tar.gz" moomer README.md
          shasum -a 256 "moomer-${VERSION}-macos.tar.gz" > "moomer-${VERSION}-macos.tar.gz.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Moomer-${{ github.ref_name }}-macos.zip
            Moomer-${{ github.ref_name }}-macos.zip.sha256
            moomer
            moomer-${{ github.ref_name }}-macos.tar.gz
            moomer-${{ github.ref_name }}-macos.tar.gz.sha256
